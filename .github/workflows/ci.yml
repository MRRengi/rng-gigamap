name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p gigamap-cli
      - name: Test tree
        shell: python
        run: |
          import os, random
          rng = random.Random(1)
          root = r"C:\gmtest"
          dirs = [root]
          for i in range(300):
              d = os.path.join(rng.choice(dirs), f"Папка {i}" if i % 3 else f"dir_{i}")
              os.makedirs(d, exist_ok=True)
              dirs.append(d)
          for i in range(20000):
              n = rng.choice([0, 10, 700, 5000, 70000, 1 << 20])
              with open(os.path.join(rng.choice(dirs), f"f{i}.bin"), "wb") as f:
                  f.write(os.urandom(n))
      - name: MFT vs folder walk
        run: '.\target\release\gigamap.exe selfcheck C:\gmtest'
      - name: Full drive scan
        run: '.\target\release\gigamap.exe scan C: -n 12'
      - name: Hotspots
        run: '.\target\release\gigamap.exe top C: -n 10'
      - name: MCP smoke test
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"disk_overview","arguments":{"path":"C:"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"cleanup_candidates","arguments":{"path":"C:"}}}' \
            | target/release/gigamap.exe mcp | tee mcp.out
          grep -q '"id":3' mcp.out
      - uses: actions/upload-artifact@v4
        with:
          name: gigamap-cli-windows
          path: target/release/gigamap.exe

  app:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build CLI sidecar
        shell: bash
        run: |
          cargo build --release -p gigamap-cli
          mkdir -p app/src-tauri/binaries
          cp target/release/gigamap.exe app/src-tauri/binaries/gigamap-x86_64-pc-windows-msvc.exe
      - name: Build app and installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - name: Portable zip
        shell: pwsh
        run: |
          $out = "Gigamap-portable"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item app/src-tauri/target/release/gigamap-app.exe "$out/Gigamap.exe"
          Copy-Item target/release/gigamap.exe "$out/gigamap.exe"
          Copy-Item README.md, LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath Gigamap-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gigamap-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            Gigamap-portable.zip
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'chore: release') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Gigamap ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            Gigamap-portable.zip

  ntfs-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ntfs-3g
      - run: cargo test --workspace --release
      - run: cargo build --release -p gigamap-cli
      - name: NTFS ground truth
        run: sudo python3 bench/ntfs.py --files 4000
      - name: NTFS throughput
        run: sudo python3 bench/ntfs.py --files 150000 --tiny
