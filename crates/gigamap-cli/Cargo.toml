[package]
name = "gigamap-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gigamap"
path = "src/main.rs"

[dependencies]
gigamap-core = { path = "../gigamap-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
